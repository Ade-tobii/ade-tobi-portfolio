# Render Blueprint: deploys this repo as a free Static Site.
# In Render: New + → Blueprint → pick this repo. Render reads this file.
services:
  - type: web
    runtime: static
    name: ade-tobi-portfolio
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Your live URL, e.g. https://adetobi.dev (or the onrender.com URL at first).
      - key: SITE_URL
        sync: false
      # Your n8n Webhook URL for the contact form. Leave unset to use email fallback.
      - key: PUBLIC_CONTACT_WEBHOOK_URL
        sync: false
    headers:
      # Security headers on every page
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      # Astro's /_astro/ files have content hashes in their names, so they can be cached forever
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
